[project]
name = "vibrapilot"
version = "1.0.6.33"
description = "VibraPilot browser automation desktop application by Vib Tools."
requires-python = ">=3.12,<3.13"
license = {text = "GPL-3.0-only"}
authors = [{name = "Vib Tools"}]
dependencies = [
  "PySide6>=6.7,<7",
  "pandas==2.2.3",
  "requests>=2.32,<3",
  "cryptography>=49,<50",
  "playwright==1.61.0",
  "openpyxl==3.1.5",
  "xlrd==2.0.2",
  "defusedxml==0.7.1",
]

[project.urls]
Homepage = "https://vib.tools/"
Repository = "https://github.com/vibtools/VibraPilot"
Documentation = "https://github.com/vibtools/VibraPilot/tree/main/docs"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
