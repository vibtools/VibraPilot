name: Portable Windows Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-portable:
    runs-on: windows-2022
    env:
      PYTHONPATH: ${{ github.workspace }}\src;${{ github.workspace }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'

      - name: Validate source and tag release identity
        shell: pwsh
        run: |
          @'
          import os
          import sys
          from config.AppConfig.app import VERSION

          expected = f"v{VERSION}"
          if os.environ.get("GITHUB_REF_TYPE") == "tag":
              actual = os.environ.get("GITHUB_REF_NAME", "")
              if actual != expected:
                  raise SystemExit(f"Release tag/version mismatch: expected {expected}, found {actual}.")
          print(f"Portable source version: {VERSION}")
          '@ | python -

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pytest

      - name: Verify source and tests
        shell: pwsh
        run: |
          python scripts/verify_repository.py
          python -m pytest -q
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Install pinned portable build dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements-portable.txt

      - name: Build Nuitka standalone OneDir portable archive
        shell: pwsh
        run: python scripts/packaging/build_portable_nuitka.py

      - name: Forensic portable artifact verification
        shell: pwsh
        run: |
          $version = python -c "from config.AppConfig.app import VERSION; print(VERSION)"
          $name = "VibraPilot-$version-Windows-x64-Portable"
          python scripts/packaging/verify_portable_release.py `
            --release-dir "release/$name" `
            --zip "release/$name.zip" `
            --sha256 "release/$name.zip.sha256" `
            --report "release/$name-VERIFY.json"

      - name: Startup smoke — packaged executable remains healthy
        shell: pwsh
        run: |
          $version = python -c "from config.AppConfig.app import VERSION; print(VERSION)"
          $name = "VibraPilot-$version-Windows-x64-Portable"
          $exe = Join-Path $PWD "release/$name/VibraPilot.exe"
          $env:VIB_TOOLS_DATA_DIR = Join-Path $env:RUNNER_TEMP "VibraPilotPortableSmoke"
          New-Item -ItemType Directory -Force -Path $env:VIB_TOOLS_DATA_DIR | Out-Null
          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 12
          $process.Refresh()
          if ($process.HasExited) {
            throw "VibraPilot.exe exited during startup smoke with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force

      - name: Show portable size inventory
        shell: pwsh
        run: |
          $version = python -c "from config.AppConfig.app import VERSION; print(VERSION)"
          $name = "VibraPilot-$version-Windows-x64-Portable"
          Get-Item "release/$name.zip" | Select-Object Name,Length
          Get-ChildItem "release/$name" -File -Recurse |
            Sort-Object Length -Descending |
            Select-Object -First 20 FullName,Length

      - name: Upload portable candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibraPilot-Windows-x64-Portable
          path: |
            release/*-Windows-x64-Portable.zip
            release/*-Windows-x64-Portable.zip.sha256
            release/*-Windows-x64-Portable-BUILD-INFO.json
            release/*-Windows-x64-Portable-VERIFY.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem release\*-Windows-x64-Portable.zip -File | Select-Object -First 1
          $sha = Get-ChildItem release\*-Windows-x64-Portable.zip.sha256 -File | Select-Object -First 1
          if (-not $zip -or -not $sha) { throw "Portable release assets were not found." }
          gh release create "$env:GITHUB_REF_NAME" "$($zip.FullName)" "$($sha.FullName)" `
            --verify-tag `
            --title "VibraPilot $env:GITHUB_REF_NAME" `
            --generate-notes
