name: PR-12 Package Build

on:
  push:
    branches: ['pr12-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    env:
      PYTHONPATH: ${{ github.workspace }}\src
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12.10 x64
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
          architecture: 'x64'

      - name: Static repository verification
        run: python scripts/verify_repository.py

      - name: Install WiX Toolset 6.0.2 in ephemeral runner
        shell: pwsh
        run: |
          $toolDir = Join-Path $env:RUNNER_TEMP 'wix-6.0.2'
          dotnet tool install --tool-path $toolDir wix --version 6.0.2
          $wixExe = Join-Path $toolDir 'wix.exe'
          $actual = (& $wixExe --version | Out-String).Trim()
          if ($actual -notmatch '^6\.0\.2(?:\+|$)') { throw "WiX version mismatch: $actual" }
          "WIX_EXE=$wixExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "WiX: $actual"

      - name: Verify targeted WiX ICE64 fix contract
        run: python tests/test_v10629_pr12_wix_ice64_fix.py

      - name: Build Nuitka OneDir, portable ZIP and WiX MSI
        # Core packaging remains build.py; do not invoke python build.py directly here.
        # Cycle-2 adapter replaces only generated WiX payload-directory authoring.
        run: python scripts/packaging/pr12_package_build.py

      - name: Verify GitHub-built package artifacts
        run: python scripts/diagnostics/pr12_ci_package_artifact_verify.py --release release

      - name: Prepare PC acceptance verifier
        shell: pwsh
        run: Copy-Item scripts/diagnostics/pr12_packaging_acceptance_runner.py release/verify_vibrapilot_v10629_pr12_pc.py

      - name: Upload PR-12 Windows package
        uses: actions/upload-artifact@v4
        with:
          name: VibraPilot-1.0.6.29-PR12-Windows-x64
          path: |
            release/VibraPilot-1.0.6.29-Windows-x64.zip
            release/VibraPilot-1.0.6.29-Windows-x64.zip.sha256
            release/VibraPilot-1.0.6.29-Windows-x64.msi
            release/VibraPilot-1.0.6.29-Windows-x64.msi.sha256
            release/VibraPilot-1.0.6.29-Windows-x64-BUILD_MANIFEST.json
            release/VibraPilot-1.0.6.29-Nuitka-Report.xml
            release/verify_vibrapilot_v10629_pr12_pc.py
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
